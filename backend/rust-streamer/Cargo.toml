[package]
name = "rust-streamer"
version = "0.1.0"
edition = "2021"

[dependencies]
tokio = { version = "1.38", features = ["rt-multi-thread", "macros", "time", "process", "sync", "io-util", "net"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
reqwest = { version = "0.12", features = ["json", "multipart", "stream"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
thiserror = "1.0"
url = "2.5"
base64 = "0.22"
des = "0.8"
cipher = "0.4"
regex = "1.10"
tokio-postgres = "0.7.18"
postgres-native-tls = "0.5.3"
native-tls = "0.2.18"
axum = "0.8.9"
futures-util = "0.3.34"
tower = { version = "0.5.3", features = ["util"] }
